<main>
  <mat-stepper
    [linear]="true"
    [orientation]="stepperOrientation()"
    (selectionChange)="onStepChange($event)"
  >
    <mat-step [stepControl]="firstFormGroup" label="Choose a service">
      <app-options-step />
    </mat-step>
    <mat-step [stepControl]="secondFormGroup" label="Choose a time">
      <app-select-step />
    </mat-step>
    <mat-step [stepControl]="thirdFormGroup" label="Contact info">
      <app-contact-step />
    </mat-step>
    <mat-step label="Confirm your slot">
      <app-confirm-step />
    </mat-step>
  </mat-stepper>
</main>
