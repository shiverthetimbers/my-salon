<form [formGroup]="bookParent.firstFormGroup">
  <div class="fields-div">
    <mat-form-field>
      <mat-label>Choose a service</mat-label>
      <mat-select formControlName="service" required>
        @for (svc of (services$ | async) ?? []; track svc.id) {
        <mat-option [value]="svc.id">{{ svc.name }} ${{ svc.price }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
    <mat-form-field>
      <mat-label>Choose a stylist</mat-label>
      <mat-select formControlName="stylist" required>
        <mat-option value="any">- Any available -</mat-option>
        @for (sty of (stylists$ | async); track sty.id) {
        <mat-option [value]="sty.id">{{ sty.name }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
    <mat-form-field>
      <mat-label>Choose a date</mat-label>
      <input
        matInput
        placeholder="Click the calendar ->"
        [min]="minDate"
        [max]="maxDate"
        [matDatepicker]="picker"
        formControlName="date"
        required
      />
      <mat-hint>MM/DD/YYYY</mat-hint>
      <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
    </mat-form-field>
  </div>
  <div class="btn-div">
    <button [disabled]="!bookParent.firstFormGroup.valid" mat-raised-button matStepperNext>
      Next
    </button>
  </div>
</form>
