<form [formGroup]="bookParent.secondFormGroup">
  <mat-card>
    <mat-card-header>
      <mat-card-title>Available Times</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <div class="time-groups" role="radiogroup">
        @for (time of (slots$ | async) ?? []; track $index) {
        <button matButton (click)="selectSlot(time)">
          {{ time.start | date : 'shortTime' }}
        </button>
        } @empty {
        <p>Loading available times...</p>
        }
      </div>
    </mat-card-content>
  </mat-card>
</form>
@if (bookParent.secondFormGroup.get('time')?.value; as picked) {
<p>Selected time: {{ picked.start | date : 'shortTime' }}</p>
}
<div class="btn-div">
  <button mat-raised-button matStepperPrevious>Back</button>
  <button [disabled]="!bookParent.secondFormGroup.valid" mat-raised-button matStepperNext>
    Next
  </button>
</div>
